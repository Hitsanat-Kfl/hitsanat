name: CI Pipeline

on:
  push:
    branches: ["main", "master", "develop", "release/**", "feature/**", "fix/**", "chore/**"]
  pull_request:
    branches: ["main", "master", "develop"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Code Quality, Tests & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: hitsanat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/hitsanat_test
      TEST_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/hitsanat_test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts || pnpm install --ignore-scripts

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Biome Format & Lint Check
        run: |
          pnpm format:check
          pnpm lint

      - name: TypeScript Typecheck
        run: pnpm typecheck

      - name: Run Unit Tests
        run: pnpm test:unit

      - name: Run Database Migrations
        run: pnpm --filter @repo/database db:migrate

      - name: Run PostgreSQL Integration Tests
        run: pnpm test:integration

      - name: Build Applications & Packages
        run: pnpm build

      - name: Run Playwright E2E & Accessibility Tests
        run: pnpm test:e2e

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
