<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="260" viewBox="0 0 1600 260" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Community hall in soft daylight">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9c2c8"/>
      <stop offset="0.55" stop-color="#a3adb4"/>
      <stop offset="1" stop-color="#8b979f"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a19b92"/>
      <stop offset="1" stop-color="#847d73"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#645f59"/>
      <stop offset="1" stop-color="#4d4a45"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7f7b73"/>
      <stop offset="1" stop-color="#5f5c56"/>
    </linearGradient>
    <!-- Asymmetric scrim: darker LEFT for motto text, lighter RIGHT so the
         church structure reads clearly (reference §10). -->
    <linearGradient id="scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#182235" stop-opacity="0.72"/>
      <stop offset="0.45" stop-color="#182235" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#182235" stop-opacity="0.28"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Overcast daylight sky -->
  <rect width="1600" height="130" fill="url(#sky)"/>
  <ellipse cx="900" cy="40" rx="420" ry="36" fill="#ccd4d8" opacity="0.55" filter="url(#soft)"/>
  <ellipse cx="1400" cy="58" rx="420" ry="40" fill="#c7cfd3" opacity="0.5" filter="url(#soft)"/>

  <!-- Distant treeline -->
  <path d="M0 118 Q160 96 320 112 T660 110 T1000 114 T1340 108 T1600 116 V260 H0 Z" fill="#757d74" opacity="0.75"/>
  <path d="M0 126 Q210 108 430 120 T880 118 T1300 122 T1600 118 V260 H0 Z" fill="#666d64" opacity="0.7"/>

  <!-- Community hall: positioned toward the RIGHT (reference §10).
       Walls/roof/windows sit right-of-center; left side stays open negative space. -->
  <rect x="880" y="118" width="500" height="102" fill="url(#wall)"/>
  <path d="M858 122 L1130 72 L1402 122 Z" fill="url(#roof)"/>
  <rect x="1123" y="30" width="9" height="48" rx="3" fill="#514d46"/>
  <rect x="1106" y="47" width="43" height="9" rx="3" fill="#514d46"/>
  <!-- Windows: warm interior light -->
  <g opacity="0.9">
    <rect x="924" y="150" width="44" height="58" rx="4" fill="#d5c69d"/>
    <rect x="1000" y="150" width="44" height="58" rx="4" fill="#d0c198"/>
    <rect x="1210" y="150" width="44" height="58" rx="4" fill="#d5c69d"/>
    <rect x="1286" y="150" width="44" height="58" rx="4" fill="#ccbd94"/>
  </g>
  <g stroke="#6f685f" stroke-width="3">
    <path d="M946 150 V208 M924 179 H968"/>
    <path d="M1022 150 V208 M1000 179 H1044"/>
    <path d="M1232 150 V208 M1210 179 H1254"/>
    <path d="M1308 150 V208 M1286 179 H1330"/>
  </g>
  <!-- Entrance -->
  <rect x="1086" y="158" width="70" height="62" rx="3" fill="#423c35"/>
  <rect x="1092" y="164" width="28" height="56" rx="2" fill="#544d45"/>
  <rect x="1122" y="164" width="28" height="56" rx="2" fill="#544d45"/>

  <!-- Small annex building, far right edge -->
  <rect x="1450" y="142" width="140" height="78" fill="#948d83"/>
  <path d="M1438 146 L1520 114 L1602 146 Z" fill="#585450"/>
  <rect x="1474" y="166" width="34" height="34" rx="3" fill="#c6b794"/>
  <rect x="1536" y="166" width="34" height="34" rx="3" fill="#c1b28f"/>

  <!-- Gathered community (abstract figures, muted) -->
  <g fill="#524c43" opacity="0.85">
    <circle cx="1010" cy="200" r="9"/><rect x="1000" y="210" width="20" height="34" rx="8"/>
    <circle cx="1052" cy="204" r="8"/><rect x="1043" y="213" width="18" height="31" rx="7"/>
    <circle cx="1092" cy="199" r="9"/><rect x="1082" y="209" width="20" height="35" rx="8"/>
    <circle cx="1240" cy="202" r="8"/><rect x="1231" y="212" width="18" height="31" rx="7"/>
    <circle cx="1278" cy="198" r="9"/><rect x="1268" y="208" width="20" height="34" rx="8"/>
    <circle cx="1318" cy="203" r="8"/><rect x="1310" y="212" width="17" height="30" rx="7"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="216" width="1600" height="44" fill="url(#ground)"/>
  <path d="M0 218 Q400 212 800 218 T1600 216 V260 H0 Z" fill="#6d6a62" opacity="0.6"/>

  <!-- Asymmetric dark scrim: heavier on the left for motto readability -->
  <rect width="1600" height="260" fill="url(#scrim)"/>
</svg>
