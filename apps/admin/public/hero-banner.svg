<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="260" viewBox="0 0 1600 260" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Community hall in soft daylight">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8cfd4"/>
      <stop offset="0.55" stop-color="#b3bcc2"/>
      <stop offset="1" stop-color="#9aa5ac"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8a29a"/>
      <stop offset="1" stop-color="#8f887f"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e6a66"/>
      <stop offset="1" stop-color="#57544f"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e8a82"/>
      <stop offset="1" stop-color="#6f6c66"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182235" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#182235" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#182235" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Overcast daylight sky -->
  <rect width="1600" height="130" fill="url(#sky)"/>
  <ellipse cx="420" cy="40" rx="380" ry="36" fill="#d7dde0" opacity="0.55" filter="url(#soft)"/>
  <ellipse cx="1150" cy="55" rx="460" ry="42" fill="#d2d9dc" opacity="0.5" filter="url(#soft)"/>

  <!-- Distant treeline -->
  <path d="M0 118 Q140 96 300 112 T640 110 T980 114 T1320 108 T1600 116 V260 H0 Z" fill="#7b8279" opacity="0.75"/>
  <path d="M0 126 Q200 108 420 120 T860 118 T1280 122 T1600 118 V260 H0 Z" fill="#6d746b" opacity="0.7"/>

  <!-- Community hall: walls, roof, cross -->
  <rect x="560" y="118" width="470" height="102" fill="url(#wall)"/>
  <path d="M540 122 L795 74 L1050 122 Z" fill="url(#roof)"/>
  <rect x="789" y="34" width="8" height="46" rx="3" fill="#5a564f"/>
  <rect x="774" y="50" width="38" height="8" rx="3" fill="#5a564f"/>
  <!-- Windows: warm interior light -->
  <g opacity="0.9">
    <rect x="600" y="150" width="42" height="56" rx="4" fill="#d8c9a3"/>
    <rect x="672" y="150" width="42" height="56" rx="4" fill="#d3c49e"/>
    <rect x="880" y="150" width="42" height="56" rx="4" fill="#d8c9a3"/>
    <rect x="952" y="150" width="42" height="56" rx="4" fill="#cfc09a"/>
  </g>
  <g stroke="#7a736a" stroke-width="3">
    <path d="M621 150 V206 M600 178 H642"/>
    <path d="M693 150 V206 M672 178 H714"/>
    <path d="M901 150 V206 M880 178 H922"/>
    <path d="M973 150 V206 M952 178 H994"/>
  </g>
  <!-- Entrance -->
  <rect x="762" y="158" width="66" height="62" rx="3" fill="#4c463f"/>
  <rect x="768" y="164" width="26" height="56" rx="2" fill="#5d564e"/>
  <rect x="796" y="164" width="26" height="56" rx="2" fill="#5d564e"/>

  <!-- Small annex building -->
  <rect x="1120" y="140" width="150" height="80" fill="#a19a90"/>
  <path d="M1108 144 L1195 112 L1282 144 Z" fill="#66625c"/>
  <rect x="1146" y="164" width="34" height="34" rx="3" fill="#c9ba97"/>
  <rect x="1210" y="164" width="34" height="34" rx="3" fill="#c4b592"/>

  <!-- Gathered community (abstract figures, muted) -->
  <g fill="#5e584f" opacity="0.85">
    <circle cx="330" cy="196" r="9"/><rect x="320" y="206" width="20" height="34" rx="8"/>
    <circle cx="372" cy="200" r="8"/><rect x="363" y="209" width="18" height="31" rx="7"/>
    <circle cx="412" cy="195" r="9"/><rect x="402" y="205" width="20" height="35" rx="8"/>
    <circle cx="452" cy="201" r="8"/><rect x="444" y="210" width="17" height="30" rx="7"/>
    <circle cx="492" cy="196" r="9"/><rect x="482" y="206" width="20" height="34" rx="8"/>
    <circle cx="1210" cy="200" r="8"/><rect x="1201" y="210" width="18" height="30" rx="7"/>
    <circle cx="1248" cy="197" r="9"/><rect x="1238" y="207" width="20" height="33" rx="8"/>
    <circle cx="1286" cy="201" r="8"/><rect x="1278" y="210" width="17" height="30" rx="7"/>
  </g>
  <g fill="#544e45" opacity="0.8">
    <circle cx="545" cy="199" r="8"/><rect x="536" y="209" width="18" height="31" rx="7"/>
    <circle cx="585" cy="203" r="8"/><rect x="577" y="212" width="17" height="28" rx="7"/>
    <circle cx="1050" cy="201" r="8"/><rect x="1041" y="211" width="18" height="29" rx="7"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="216" width="1600" height="44" fill="url(#ground)"/>
  <path d="M0 218 Q400 212 800 218 T1600 216 V260 H0 Z" fill="#7c786f" opacity="0.6"/>

  <!-- Subtle dark scrim for overlay text readability -->
  <rect width="1600" height="260" fill="url(#scrim)"/>
</svg>
