services:
  postgres:
    image: postgres:16-alpine
    container_name: hitsanat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: hitsanat_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:16-alpine
    container_name: hitsanat-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: hitsanat_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: hitsanat-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/hitsanat_dev
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  portfolio:
    build:
      context: .
      dockerfile: docker/Dockerfile.portfolio
    container_name: hitsanat-portfolio
    restart: unless-stopped
    ports:
      - "3000:3000"

  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin
    container_name: hitsanat-admin
    restart: unless-stopped
    ports:
      - "3002:3002"

volumes:
  postgres_data:
    driver: local
